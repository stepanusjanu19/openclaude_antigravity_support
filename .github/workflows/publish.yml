# Publish to npm — unified OpenClaude + Antigravity provider package.
#
# Builds the FULL distribution on a Windows runner (required so the bundled
# Antigravity proxy compiles natively to a Windows .exe, exactly as it does
# locally) and publishes the package defined in package.json.
#
# Triggers:
#   - Publishing a GitHub Release (any tag)
#   - Manual run (workflow_dispatch)
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   NPM_TOKEN — an npmjs.com access token (Automation type) with publish
#   rights for the package name in package.json.
#
# NOTE: version is auto-incremented on the runner by the "Smart version bump"
# step — package.json keeps the upstream base (e.g. 0.30.0) in the repo, and
# each publish produces <base>-antigravity, then increments the PATCH for the
# next run (0.30.1-antigravity, 0.30.2-antigravity, ...). A MAJOR.MINOR bump
# in package.json (new feature: 0.31.0, 1.0.0) starts a fresh chain. No
# manual version commits are needed.

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

# The repository this workflow is allowed to publish from. GitHub sets the
# checkout remote to the workflow's own repo, so GITHUB_REPOSITORY is the
# authoritative "remote origin" inside Actions. Update this value if the
# repo is renamed or moved.
env:
  EXPECTED_REPOSITORY: stepanusjanu19/openclaude_antigravity_support
  EXPECTED_NPM_SCOPE: xkei

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # Guard: this workflow must only publish from the expected repository.
      # Prevents accidental publishes from the upstream repo or another fork
      # (e.g. a clone where the origin URL was left pointing elsewhere).
      - name: Verify repository origin
        shell: pwsh
        run: |
          $expected = $env:EXPECTED_REPOSITORY
          $actual = $env:GITHUB_REPOSITORY
          Write-Host "Remote origin: $env:GITHUB_SERVER_URL/$actual.git"
          Write-Host "Expected repo: $env:GITHUB_SERVER_URL/$expected.git"
          if ($actual -ne $expected) {
            Write-Host "::error::Publish blocked: workflow ran in '$actual' but is configured for '$expected'. Update EXPECTED_REPOSITORY in .github/workflows/publish.yml if this is intentional."
            exit 1
          }
          Write-Host "Repository origin check passed."

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Smart version bump: queries the npm registry for the highest published
      # patch in this MAJOR.MINOR family carrying the -antigravity flag, then
      # writes the next one (base 0.30.0 -> 0.30.0-antigravity, then
      # 0.30.1-antigravity, 0.30.2-antigravity, ...). A package.json bump to a
      # higher patch or a new MAJOR.MINOR (0.31.0 / 1.0.0) takes precedence and
      # starts from there. On-runner only; nothing is committed back. Runs
      # BEFORE the build so the version is inlined into the CLI bundle.
      # Exports PUBLISHED_VERSION to GITHUB_ENV for later steps.
      - name: Smart version bump (-antigravity)
        run: node scripts/bump-antigravity-version.mjs

      # Compile the bundled Antigravity proxy for all platforms (cross-compile)
      - name: Build Antigravity proxy executable
        run: bun run build:proxy

      - name: Verify proxy executables exist
        shell: pwsh
        run: |
          $bins = @(
            "vendor/openclaude-antigravity-provider/bin/antigravity-proxy-win-x64.exe",
            "vendor/openclaude-antigravity-provider/bin/antigravity-proxy-linux-x64",
            "vendor/openclaude-antigravity-provider/bin/antigravity-proxy-linux-arm64",
            "vendor/openclaude-antigravity-provider/bin/antigravity-proxy-darwin-x64",
            "vendor/openclaude-antigravity-provider/bin/antigravity-proxy-darwin-arm64"
          )
          foreach ($b in $bins) {
            if (-not (Test-Path $b)) { Write-Error "Missing: $b"; exit 1 }
            Write-Host "OK $b ($([math]::Round((Get-Item $b).Length/1MB,1)) MB)"
          }

      # Build dist/cli.mjs + dist/sdk.mjs and run the bundle validations
      - name: Build OpenClaude CLI
        run: bun run build

      - name: Smoke test
        shell: pwsh
        run: |
          $embedded = (node dist/cli.mjs --version).Trim()
          $expected = $env:PUBLISHED_VERSION
          Write-Host "Embedded version: $embedded (expected: $expected)"
          if ($expected -and ($embedded -notlike "*$expected*")) {
            Write-Host "::error::CLI bundle does not report the bumped version. Expected '$expected' in '$embedded'."
            exit 1
          }

      # Preview exactly what will be packed (files array + vendor bundle)
      - name: Pack preview (dry run)
        run: npm pack --dry-run

      # Advisory: npm scoped names (@scope/name) can only be published by
      # tokens with rights to that scope. EXPECTED_NPM_SCOPE documents the
      # intended npm account for this fork.
      - name: Package name / scope advisory
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json)
          $repo = $env:GITHUB_REPOSITORY
          $expectedScope = $env:EXPECTED_NPM_SCOPE
          if ($pkg.name -like '@*/*') {
            $scopeOwner = ($pkg.name -split '/')[0] -replace '@', ''
            if ($expectedScope -and $scopeOwner -ne $expectedScope) {
              Write-Host "::error::Package '$($pkg.name)' uses npm scope '@$scopeOwner' but this workflow expects '@$expectedScope'. Update package.json or EXPECTED_NPM_SCOPE."
              exit 1
            } elseif ($expectedScope) {
              Write-Host "Package scope matches expected npm scope: @$scopeOwner"
            } elseif ($repo -notlike "$scopeOwner/*") {
              Write-Host "::warning::Package '$($pkg.name)' uses the '@$scopeOwner' npm scope but this repo is '$repo'. Publishing succeeds only if NPM_TOKEN has rights to that scope - otherwise rename the package in package.json (e.g. '@$($repo -split '/')[0]/openclaude')."
            } else {
              Write-Host "Package scope matches repository owner: $($pkg.name)"
            }
          } else {
            Write-Host "Unscoped package name: $($pkg.name)"
          }

      # npm refuses to auto-assign the `latest` dist-tag to prerelease
      # versions (any version with a hyphen, like 0.30.0-antigravity), so the
      # tag must be explicit. `--tag latest` makes plain
      # `npm install -g <package-name>` resolve to this build.
      - name: Publish to npm
        run: npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Also expose an explicit `antigravity` dist-tag so users can install
      # the Antigravity build even if upstream later reclaims `latest`.
      # Non-fatal: the publish above already succeeded if this fails.
      - name: Tag antigravity dist-tag
        continue-on-error: true
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json)
          npm dist-tag add "$($pkg.name)@$($env:PUBLISHED_VERSION)" antigravity

      - name: Publish summary
        if: success()
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json)
          {
            "## Published to npm"
            ""
            "- Package: $($pkg.name)@$($env:PUBLISHED_VERSION)"
            "- npm: https://www.npmjs.com/package/$($pkg.name)"
            "- Install: npm install -g $($pkg.name)"
            "- Install (pinned): npm install -g $($pkg.name)@$($env:PUBLISHED_VERSION)"
            "- Install (tag): npm install -g $($pkg.name)@antigravity"
            "- Bundle: OpenClaude CLI + openclaude-antigravity-provider (proxy exe included)"
          } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
